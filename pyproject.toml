[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathanchor"
version = "1.0.0"
description = "Guideline-anchored evidence-path estimation for melanoma treatment response"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
pathanchor-build-graph = "pathanchor.cli.build_graph:main"
pathanchor-train = "pathanchor.cli.train:main"
pathanchor-evaluate = "pathanchor.cli.evaluate:main"
pathanchor-ablate = "pathanchor.cli.ablate:main"
pathanchor-calibrate = "pathanchor.cli.calibrate:main"
pathanchor-verify = "pathanchor.cli.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:pathanchor.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", "reports", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "RET", "C4", "PIE", "TID", "PTH", "RUF"]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
force_sort_within_sections = false
known_first_party = ["pathanchor"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pathanchor"]
exclude = ["^src/pathanchor/theory/.*", "build", "dist"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "torch.*"]
ignore_missing_imports = true
